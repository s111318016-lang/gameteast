<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>集大成</title>
<style>
  :root {
    /* =====================================================
       ★ 配色區：只要改這裡的色碼（# 開頭那串）就好 ★
       ===================================================== */
    --page-bg: #e3f4d1;          /* 整個網頁的背景色 */
    --text: #5a3b1e;             /* 網頁上的文字顏色（分數、下一個） */

    --box-bg: #a6d279;           /* 遊戲框內的背景色（沒有背景圖、也沒有車廂圖時才看得到） */
    --box-border: #52841f;       /* 遊戲框的框線顏色 */
    --next-bg: #fff8ea;          /* 右上角「下一個」小框的背景色 */
    --next-border: #8b5e3c;      /* 右上角「下一個」小框的框線顏色 */

    --dim: rgba(0,0,0,.65);      /* 跳出畫面時，後方的半透明遮罩 */
    --panel-bg: #d5e383;         /* 開始／結束／勝利畫面的底色 */
    --panel-border: #7f8f22;     /* 開始／結束／勝利畫面的框線 */
    --panel-text: #5a3b1e;       /* 開始／結束／勝利畫面的文字顏色 */
    --divider: #52841F;          /* 介紹頁的分隔線 */

    /* 介紹列表中，每個元素的小卡片 */
    --tile-bg: #f0f9b4;          /* 小卡片的底色 */
    --tile-border: #7f8f22;      /* 小卡片的框線 */

    /* 「特色介紹／地方‧品牌故事」的切換標籤 */
    --tab-bg: #f0f9b4;           /* 未選取時的底色 */
    --tab-text: #52841F;         /* 未選取時的文字顏色 */
    --tab-border: #7f8f22;       /* 標籤框線 */
    --tab-active-bg: #52841F;    /* 被選取時的底色 */
    --tab-active-text: #ffffff;  /* 被選取時的文字顏色 */

    /* 成績卡（玩家截圖回傳的那張卡片）*/
    --card-bg: #f0f9b4;          /* 成績卡底色 */
    --card-border: #52841F;      /* 成績卡框線 */
    --card-text: #3b5a14;        /* 成績卡文字 */

    /* 按鈕：底色 / 文字 / 框線 */
    --main-bg: #f0f9b4;     --main-text: #52841F;  --main-border: #7f8f22;   /* 開始遊戲／再玩一次／繼續遊玩 */
    --intro-bg: #f0f9b4;    --intro-text: #52841F; --intro-border: #7f8f22;  /* 查看介紹 */
    --feedback-bg: #f0f9b4; --feedback-text: #52841F; --feedback-border: #7f8f22;  /* 旅程回饋 */
    --back-bg: #f0f9b4;     --back-text: #52841F;  --back-border: #7f8f22;   /* 各頁的「返回」 */
    --share-bg: #f0f9b4;    --share-text: #52841F; --share-border: #7f8f22;  /* 分享、排行榜、儲存、複製 */
    --line-bg: #06c755;     --line-text: #ffffff;  --line-border: #05a547;   /* 前往 LINE@ 回傳截圖 */
  }

  body { margin:0; background:var(--page-bg); color:var(--text); font-family:sans-serif; display:flex; flex-direction:column;
         align-items:center; touch-action:none; user-select:none; -webkit-user-select:none;
         background-size:cover; background-position:center; background-attachment:fixed; }
  #hud { width:360px; display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:18px; color:var(--text); }
  #hud .next { display:flex; align-items:center; gap:6px; }
  #game { width:360px; height:auto; background:var(--box-bg); border:3px solid var(--box-border); border-radius:8px; }
  #nextCanvas { width:64px; height:64px; background:var(--next-bg); border:3px solid var(--next-border); border-radius:8px; }

  /* ===== 開始 / 結束 / 過關 頁面 ===== */
  #overlay { position:fixed; inset:0; background:var(--dim); display:none; align-items:center;
             justify-content:center; z-index:10; padding:12px; box-sizing:border-box; }
  #overlay.show { display:flex; }
  .panel { background:var(--panel-bg); border:4px solid var(--panel-border); border-radius:16px; padding:22px; width:min(94vw, 460px);
           max-height:92vh; overflow:auto; text-align:center; color:var(--panel-text); touch-action:pan-y; box-sizing:border-box;
           user-select:text; -webkit-user-select:text; }
  .panel h1 { margin:0 0 6px; font-size:clamp(22px, 7vw, 30px); letter-spacing:1px; overflow-wrap:anywhere; }
  .panel h2 { margin:0 0 12px; font-size:24px; }
  .panel h3 { margin:14px 0 6px; font-size:17px; text-align:left; }
  .panel .sub { margin:0 0 10px; font-size:15px; opacity:.85; }
  .panel p, .panel ol { text-align:left; line-height:1.7; font-size:15px; margin:4px 0; white-space:pre-line; }
  .panel ol { padding-left:22px; white-space:normal; }
  .btn { display:block; width:100%; margin:10px 0 0; padding:13px; font-size:18px; border-radius:10px;
         border:3px solid transparent; cursor:pointer; font-family:inherit; }
  .btn[disabled] { opacity:.55; cursor:default; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .row2 .btn { margin-top:10px; font-size:16px; padding:11px 6px; }
  #btnStart, #btnMain       { background:var(--main-bg);     color:var(--main-text);     border-color:var(--main-border); }
  #btnIntro                 { background:var(--intro-bg);    color:var(--intro-text);    border-color:var(--intro-border); }
  #btnFeedback              { background:var(--feedback-bg); color:var(--feedback-text); border-color:var(--feedback-border); }
  #btnBack, #btnDetailBack, #btnShareBack, #btnRankBack { background:var(--back-bg); color:var(--back-text); border-color:var(--back-border); }
  #btnShare, #btnRank, #btnStartShare, #btnSave, .share-grid .btn
                            { background:var(--share-bg);    color:var(--share-text);    border-color:var(--share-border); }
  #btnLine                  { background:var(--line-bg);     color:var(--line-text);     border-color:var(--line-border); font-weight:bold; }
  /* 開始頁：排緊一點，盡量一屏放得下（不用上下滑） */
  #panel:has(#viewStart:not(.hidden)) { padding:14px 16px; }
  #viewStart h1 { font-size:clamp(20px, 6vw, 26px); margin:0 0 4px; }
  #viewStart h3 { margin:8px 0 2px; font-size:15px; }
  #viewStart p, #viewStart ol { font-size:13px; line-height:1.5; margin:2px 0; }
  #viewStart ol { padding-left:18px; }
  #viewStart .field { margin:8px 0 0; font-size:14px; }
  #viewStart .btn { margin-top:8px; padding:9px; font-size:16px; }
  .hidden { display:none !important; }

  /* 暱稱輸入 */
  .field { text-align:left; margin:10px 0 0; font-size:15px; }
  .field input { width:100%; box-sizing:border-box; margin-top:4px; padding:10px; font-size:17px; border-radius:8px;
                 border:2px solid var(--panel-border); background:#fff; color:#333; font-family:inherit; }

  /* ===== 成績卡 ===== */
  .card { background:var(--card-bg); border:3px solid var(--card-border); border-radius:14px; padding:14px 12px; margin:10px 0 2px; color:var(--card-text); }
  .card .c-title { font-weight:bold; font-size:17px; }
  .card .c-nick { font-size:20px; margin-top:8px; overflow-wrap:anywhere; }          /* 暱稱 < 上方 GAME OVER 標題 < 分數 */
  .card .c-score { font-size:54px; font-weight:bold; line-height:1.15; margin:2px 0 6px; }
  .card .c-small { font-size:14px; opacity:.9; line-height:1.6; }
  .card .c-note { margin-top:8px; padding-top:8px; border-top:2px dashed var(--card-border); font-size:14px; line-height:1.6; white-space:pre-line; }

  /* ===== 分享頁 ===== */
  .share-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .share-grid .btn { margin-top:0; font-size:16px; padding:12px 6px; }
  .share-grid .btn:last-child { grid-column:1 / -1; }
  .hint { font-size:13px !important; opacity:.85; text-align:center !important; }
  #toast { position:fixed; left:50%; bottom:8%; transform:translateX(-50%); background:rgba(0,0,0,.78); color:#fff; padding:10px 16px;
           border-radius:20px; font-size:15px; z-index:30; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; }

  /* ===== 排行榜 ===== */
  .rank-row { display:grid; grid-template-columns:34px 1fr auto; gap:8px; align-items:center; text-align:left;
              padding:8px 4px; border-bottom:1px solid var(--divider); font-size:15px; }
  .rank-row.me { background:rgba(255,255,255,.55); font-weight:bold; border-radius:8px; }
  .rank-row .t { font-size:12px; opacity:.75; font-weight:normal; }
  .empty { padding:14px 0; opacity:.8; }

  /* ===== 介紹：列表（小卡片）===== */
  #introList { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:6px; }
  .group-title { grid-column:1 / -1; text-align:left; font-weight:bold; font-size:16px; padding:6px 2px 2px;
                 border-bottom:2px solid var(--divider); }
  .tile { background:var(--tile-bg); border:2px solid var(--tile-border); border-radius:12px; padding:10px 4px;
          cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px;
          color:var(--panel-text); font-family:inherit; font-size:13px; line-height:1.3; }
  .tile .st { font-size:11px; opacity:.75; }
  .thumb { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
           color:#fff; font-weight:bold; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:contain; }
  .thumb.big { width:110px; height:110px; margin:0 auto 8px; font-size:28px; }

  /* ===== 介紹：單一元素的詳細頁 ===== */
  .detail-head h2 { margin:0 0 4px; }
  .detail-head .station { font-size:14px; opacity:.85; margin-bottom:10px; }
  .tabs { display:flex; gap:6px; }
  .tab { flex:1; padding:10px 4px; font-size:15px; border-radius:10px 10px 0 0; cursor:pointer; font-family:inherit;
         border:2px solid var(--tab-border); background:var(--tab-bg); color:var(--tab-text); }
  .tab.active { background:var(--tab-active-bg); color:var(--tab-active-text); }
  .detail-text { text-align:left; white-space:pre-line; line-height:1.75; font-size:15px;
                 padding:12px 2px 8px; border-top:2px solid var(--divider); }
</style>
</head>
<body>
<div id="hud">
  <div><span id="tScore"></span><b id="score">0</b><br><span id="tBest"></span><b id="best">0</b></div>
  <div class="next"><span id="tNext"></span><canvas id="nextCanvas" width="80" height="80"></canvas></div>
</div>
<canvas id="game" width="400" height="600"></canvas>
<div id="toast"></div>

<div id="overlay">
  <div class="panel" id="panel">

    <!-- 開始頁 -->
    <div id="viewStart">
      <h1 id="startTitle"></h1>
      <div class="sub hidden" id="startSub"></div>
      <h3 id="introHeading"></h3>
      <p id="startIntro"></p>
      <h3 id="howTitle"></h3>
      <ol id="howList"></ol>
      <h3 id="rewardTitle"></h3>
      <p id="startReward"></p>
      <p id="startDeadline" class="hidden"></p>
      <div class="field">
        <label for="nickInput" id="nickLabel"></label>
        <input id="nickInput" type="text" maxlength="12" autocomplete="off">
      </div>
      <button class="btn" id="btnStart" disabled></button>
      <button class="btn" id="btnStartShare"></button>
    </div>

    <!-- 結束 / 過關 -->
    <div id="viewEnd" class="hidden">
      <h1 id="endTitle"></h1>
      <div class="card" id="card">
        <div class="c-title" id="cardTitle"></div>
        <div class="c-nick" id="cardNick"></div>
        <div class="c-score" id="cardScore"></div>
        <div class="c-small" id="cardTime"></div>
        <div class="c-small hidden" id="cardDeadline"></div>
        <div class="c-small hidden" id="cardCode"></div>
        <div class="c-note" id="cardNote"></div>
      </div>
      <button class="btn" id="btnMain"></button>
      <button class="btn" id="btnLine"></button>
      <div class="row2">
        <button class="btn" id="btnIntro"></button>
        <button class="btn" id="btnShare"></button>
      </div>
      <div class="row2 hidden" id="extraRow">
        <button class="btn hidden" id="btnRank"></button>
        <button class="btn hidden" id="btnFeedback"></button>
      </div>
    </div>

    <!-- 分享 -->
    <div id="viewShare" class="hidden">
      <h2 id="shareTitle"></h2>
      <div id="shareSaveBox">
        <button class="btn" id="btnSave"></button>
        <p class="hint" id="saveHint"></p>
      </div>
      <h3 id="shareFriendTitle"></h3>
      <div class="share-grid">
        <button class="btn" id="btnShIG"></button>
        <button class="btn" id="btnShThreads"></button>
        <button class="btn" id="btnShFB"></button>
        <button class="btn" id="btnShLine"></button>
        <button class="btn" id="btnShCopy"></button>
      </div>
      <button class="btn" id="btnShareBack"></button>
    </div>

    <!-- 本機排行榜 -->
    <div id="viewRank" class="hidden">
      <h2 id="rankTitle"></h2>
      <p id="rankNote"></p>
      <div id="rankList"></div>
      <button class="btn" id="btnRankBack"></button>
    </div>

    <!-- 介紹：元素列表 -->
    <div id="viewIntro" class="hidden">
      <h2 id="introTitle"></h2>
      <div id="introList"></div>
      <button class="btn" id="btnBack"></button>
    </div>

    <!-- 介紹：單一元素的詳細頁 -->
    <div id="viewDetail" class="hidden">
      <div class="detail-head">
        <div id="detailThumb"></div>
        <h2 id="detailName"></h2>
        <div class="station" id="detailStation"></div>
      </div>
      <div class="tabs">
        <button class="tab active" id="tabFeature"></button>
        <button class="tab" id="tabStory"></button>
      </div>
      <div class="detail-text" id="detailText"></div>
      <button class="btn" id="btnDetailBack"></button>
    </div>

  </div>
</div>

<!-- 物理引擎：優先讀取同資料夾的 matter.min.js（可離線）；找不到才從網路載入 -->
<script src="matter.min.js"></script>
<script>
  if (!window.Matter) {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"><\/script>');
  }
</script>
<script>
/* =====================================================
   ★ 你們最常改的設定都在這一區 ★
   ===================================================== */

// ===== 文案：畫面上所有固定的文字 =====
const TEXT = {
  title: '集大成',               // 瀏覽器分頁上的標題
  score: '分數：',
  best: '最高：',
  next: 'Next',
  gameOver: 'GAME OVER',         // 失敗畫面的大標題
  win: 'CONGRATULATIONS',        // 勝利畫面的大標題
  again: '再玩一次',
  keepPlaying: '繼續遊玩',
  intro: '查看介紹',
  feedback: '旅程回饋',
  introTitle: '角色介紹',
  tabFeature: '特色介紹',        // 詳細頁上的第一個標籤
  tabStory: '地方／品牌故事',    // 詳細頁上的第二個標籤
  back: '返回',
  backToList: '返回列表',
  noFeedbackLink: '回饋表單的連結還沒設定。',

  saveBtn: '儲存成績圖',

// 找出圖片的凸包（外輪廓）。回傳 0~1 的比例座標；失敗（例如直接點開檔案時瀏覽器不讓讀像素）就回傳 null
function computeHull(img) {
  try {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const s = Math.min(1, 160 / Math.max(iw, ih));
    const cw = Math.max(1, Math.round(iw * s)), ch = Math.max(1, Math.round(ih * s));
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0, cw, ch);
    const d = g.getImageData(0, 0, cw, ch).data;
    const pts = [];
    for (let y = 0; y < ch; y++) {
      let lo = -1, hi = -1;
      for (let x = 0; x < cw; x++) {
        if (d[(y * cw + x) * 4 + 3] > HULL_ALPHA) { if (lo < 0) lo = x; hi = x; }
      }
      if (lo >= 0) pts.push([lo, y], [hi + 1, y], [lo, y + 1], [hi + 1, y + 1]);
    }
    if (pts.length < 3) return null;
    let hull = convexHull(pts);
    hull = simplifyHull(hull, HULL_MAX_VERTS);
    if (hull.length < 3) return null;
    return hull.map(p => [p[0] / cw, p[1] / ch]);
  } catch (e) {
    return null;
  }
}
function convexHull(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  const upper = [];
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}
// 角太多時，一次拿掉「對外形影響最小」的角，直到剩下 max 個
function simplifyHull(h, max) {
  h = h.slice();
  while (h.length > max) {
    let best = -1, bestArea = Infinity;
    for (let i = 0; i < h.length; i++) {
      const a = h[(i + h.length - 1) % h.length], b = h[i], c = h[(i + 1) % h.length];
      const area = Math.abs((b[0] - a[0]) * (c[1] - a[1]) - (c[0] - a[0]) * (b[1] - a[1])) / 2;
      if (area < bestArea) { bestArea = area; best = i; }
    }
    h.splice(best, 1);
  }
  return h;
}
function polygonCentroid(v) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < v.length; i++) {
    const p = v[i], q = v[(i + 1) % v.length];
    const cr = p[0] * q[1] - q[0] * p[1];
    a += cr; cx += (p[0] + q[0]) * cr; cy += (p[1] + q[1]) * cr;
  }
  if (Math.abs(a) < 1e-6) return [v[0][0], v[0][1]];
  return [cx / (3 * a), cy / (3 * a)];
}
function setCircleShape(f) {
  f.shape = null; f.cx = 0; f.cy = 0;
  f.minX = -f.r; f.maxX = f.r; f.minY = -f.r; f.maxY = f.r;
}
// 圖片載入後：算出繪圖大小、碰撞形狀（相對於重心）、左右上下的範圍
function prepareFruit(f) {
  setCircleShape(f);
  if (!f.loaded) return;
  const iw = f.image.naturalWidth, ih = f.image.naturalHeight;
  f.k = (f.r * 2 * (f.imgScale || IMG_SCALE)) / Math.max(iw, ih);
  f.dw = iw * f.k; f.dh = ih * f.k;
  if (!USE_HULL) return;
  const hn = f.hull || computeHull(f.image);
  if (!hn) return;
  let v = hn.map(p => [(p[0] - 0.5) * f.dw * HULL_SCALE, (p[1] - 0.5) * f.dh * HULL_SCALE]);
  const c = polygonCentroid(v);
  f.cx = c[0]; f.cy = c[1];
  f.shape = v.map(p => [p[0] - c[0], p[1] - c[1]]);
  f.minX = Math.min(...f.shape.map(p => p[0])); f.maxX = Math.max(...f.shape.map(p => p[0]));
  f.minY = Math.min(...f.shape.map(p => p[1])); f.maxY = Math.max(...f.shape.map(p => p[1]));
}
function loadImage(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
}

// ===== 背景（車廂內部）=====
let bgCanvas = null;
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function buildInterior() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), I = INTERIOR;
  g.fillStyle = I.wall; g.fillRect(0, 0, W, H);
  g.fillStyle = I.ceiling; g.fillRect(0, 0, W, H * 0.035);
  const n = 3, gap = W * 0.04, ww = (W - gap * (n + 1)) / n, wy = H * 0.07, wh = H * 0.27;
  for (let i = 0; i < n; i++) {
    const x = gap + i * (ww + gap);
    g.fillStyle = I.frame; rrect(g, x - 6, wy - 6, ww + 12, wh + 12, 14); g.fill();
    g.save(); rrect(g, x, wy, ww, wh, 10); g.clip();
    const sky = g.createLinearGradient(0, wy, 0, wy + wh); sky.addColorStop(0, I.sky1); sky.addColorStop(1, I.sky2);
    g.fillStyle = sky; g.fillRect(x, wy, ww, wh);
    g.fillStyle = I.hill1; g.beginPath(); g.ellipse(x + ww * 0.25, wy + wh * 1.0, ww * 0.6, wh * 0.38, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = I.hill2; g.beginPath(); g.ellipse(x + ww * 0.8, wy + wh * 1.05, ww * 0.7, wh * 0.34, 0, 0, Math.PI * 2); g.fill();
    g.restore();
    g.fillStyle = I.frame; g.fillRect(x + ww / 2 - 2, wy, 4, wh);
  }
  g.fillStyle = I.panel; g.fillRect(0, H * 0.42, W, H * 0.5);
  g.fillStyle = I.rail; g.fillRect(0, H * 0.42, W, 6);
  g.fillStyle = I.seat; g.fillRect(0, H * 0.82, W, H * 0.12);
  g.strokeStyle = I.seatLine; g.lineWidth = 3;
  for (let x = W / 6; x < W; x += W / 3) { g.beginPath(); g.moveTo(x, H * 0.82); g.lineTo(x, H * 0.94); g.stroke(); }
  g.fillStyle = I.floor; g.fillRect(0, H * 0.94, W, H * 0.06);
  return c;
}
function buildImageBg(img) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  g.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  if (BG_OVERLAY) { g.fillStyle = BG_OVERLAY; g.fillRect(0, 0, W, H); }
  return c;
}

function randLevel() { return Math.floor(Math.random() * (MAX_DROP_LEVEL + 1)); }
function clampX(f, x) { return Math.max(-f.minX, Math.min(W - f.maxX, x)); }
function dropY(f) { return Math.max(40, -f.minY + 6); }

function makeFruit(level, x, y, pop) {
  const f = FRUITS[level];
  const opts = { restitution: BOUNCE, friction: FRICTION, frictionStatic: 0 };
  let body = null;
  if (f.shape) {
    try {
      body = Bodies.fromVertices(x, y, [f.shape.map(p => ({ x: p[0], y: p[1] }))], opts);
      Body.setPosition(body, { x, y });   // 讓「重心」落在指定位置
    } catch (e) { body = null; setCircleShape(f); }
  }
  if (!body) body = Bodies.circle(x, y, f.r, opts, 40);
  body.level = level;
  body.bornAt = performance.now();
  if (pop && MERGE_EFFECTS) body.popAt = performance.now();
  World.add(engine.world, body);
  return body;
}

function addScore(n) {
  score += n;
  $('score').textContent = score;
  if (score > best) {
    best = score;
    $('best').textContent = best;
    try { localStorage.setItem('best', best); } catch (e) {}
  }
}

// ===== 合併 =====
// 兩顆同等級的元素只要接觸（開始碰到，或持續碰著）就合併
let mergePairs = [];
function collectPairs(ev) {
  for (const p of ev.pairs) {
    const a = p.bodyA, b = p.bodyB;
    if (a.isStatic || b.isStatic) continue;
    if (a.level === undefined || a.level !== b.level) continue;
    if (a.level >= FRUITS.length - 1) continue;   // 最大的不再合併
    mergePairs.push([a, b]);
  }
}
Events.on(engine, 'collisionStart', collectPairs);
Events.on(engine, 'collisionActive', collectPairs);

function tryMerge() {
  const list = mergePairs;
  mergePairs = [];
  for (const [a, b] of list) {
    if (a.dead || b.dead) continue;
    mergePair(a, b);
  }
}

function mergePair(a, b) {
  const now = performance.now();
  a.dead = b.dead = true;
  const x = (a.position.x + b.position.x) / 2;
  const y = (a.position.y + b.position.y) / 2;
  const level = a.level + 1;
  const vx = (a.velocity.x + b.velocity.x) / 2;
  const vy = (a.velocity.y + b.velocity.y) / 2;

  if (MERGE_EFFECTS) {
    [a, b].forEach(o => ghosts.push({
      level: a.level, x0: o.position.x, y0: o.position.y, x1: x, y1: y, angle: o.angle, start: now
    }));
  }

  World.remove(engine.world, [a, b]);
  const nb = makeFruit(level, x, y, true);
  Body.setVelocity(nb, { x: vx, y: vy });

  const points = level * 2;
  addScore(points);
  spawnMergeFx(x, y, level, points, level === FRUITS.length - 1);

  // 合成出最後一級 → 過關
  if (level === FRUITS.length - 1 && !won) {
    won = true;
    saveRecord(true);
    setTimeout(() => { if (!gameOver) showEnd('win'); }, WIN_DELAY);
  }
}

function spawnMergeFx(x, y, level, points, big) {
  if (!MERGE_EFFECTS) return;
  const f = FRUITS[level];
  const now = performance.now();
  const rr = Math.max(f.maxX - f.minX, f.maxY - f.minY) / 2;
  fx.push({ type: 'ring', x, y, r: rr, color: f.color, start: now, dur: 380 });
  const n = big ? 26 : 10;
  for (let i = 0; i < n; i++) {
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
    const sp = 60 + Math.random() * 90;
    fx.push({ type: 'dot', x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
              size: 3 + Math.random() * 3, color: f.color, start: now, dur: 500 });
  }
  fx.push({ type: 'text', x, y: y - rr * 0.6, text: '+' + points, start: now, dur: 700 });
}

function loadRecords() {
  try { const r = JSON.parse(localStorage.getItem('records') || '[]'); return Array.isArray(r) ? r : []; } catch (e) { return []; }
}
function storeRecords(r) { try { localStorage.setItem('records', JSON.stringify(r.slice(0, 200))); } catch (e) {} }
function getNick() {
  const v = ($('nickInput').value || '').trim();
  return v || TEXT.nickDefault;
}
function pad(n) { return String(n).padStart(2, '0'); }
function fmtDate(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate());
}
function fmtTime(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function makeCode(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(36).toUpperCase().padStart(6, '0').slice(-6);
}
let lastRec = null;
function saveRecord(win) {
  if (!runId) return;
  const recs = loadRecords();
  const i = recs.findIndex(r => r.id === runId);
  const rec = { id: runId, nick: getNick(), score, time: Date.now(), win: !!(win || (i >= 0 && recs[i].win)) };
  if (i >= 0) recs[i] = rec; else recs.push(rec);
  recs.sort((a, b) => b.score - a.score || a.time - b.time);
  storeRecords(recs);
  lastRec = rec;
}
function rankOf(rec) {
  const recs = loadRecords();
  const i = recs.findIndex(r => r.id === rec.id);
  return { rank: i + 1, total: recs.length };
}

  const lines = []; let cur = '';
  // 英文、數字、@ 連在一起的字（例如 LINE@）當成一個整體，不會被從中間切開
  for (const tok of (text.match(/[A-Za-z0-9@]+|[\s\S]/g) || [])) {
    if (tok === '\n') { lines.push(cur); cur = ''; continue; }
    // 標點不放在行首（寧可這一行稍微超出一點）
    if (g.measureText(cur + tok).width > maxW && !'。，、！？：；）」』'.includes(tok)) { lines.push(cur); cur = tok; } else cur += tok;

}

      g.fillText(fmtDate(rec.time), cw / 2, y); y += 46;
      if (RANK_DEADLINE) { g.fillText(fill(TEXT.deadline, { deadline: RANK_DEADLINE }), cw / 2, y); y += 46; }
      if (SHOW_CODE) { g.fillText(TEXT.cardCode + makeCode(rec.id + '|' + rec.nick + '|' + rec.score + '|' + rec.time), cw / 2, y); y += 46; }
      y += 6;
      g.strokeStyle = cssVar('--card-border') || '#52841F'; g.lineWidth = 3; g.setLineDash([12, 8]);
      g.beginPath(); g.moveTo(80, y); g.lineTo(cw - 80, y); g.stroke(); g.setLineDash([]);
      y += 52; g.font = '28px sans-serif';
      wrapLines(g, fill(TEXT.cardNote, VARS), cw - 160).forEach(l => { g.fillText(l, cw / 2, y); y += 42; });
      c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/png');
    } catch (e) { reject(e); }
  });
}
$('btnSave').addEventListener('click', async () => {
  try {
    const blob = await makeCardBlob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'score.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { alert(TEXT.saveFail); }
});

// ===== 介紹：列表與詳細頁 =====
// 介紹頁的項目 = 每個元素各一個，再加上元素底下 extras 裡的額外介紹頁（不會增加等級，也不影響合成）
const INTRO_ITEMS = [];
FRUITS.forEach((f, i) => {
  INTRO_ITEMS.push({ name: f.name, feature: f.feature, story: f.story, img: f.img, color: f.color, station: f.station || '', index: i });
  (f.extras || []).forEach(e => INTRO_ITEMS.push({
    name: e.name, feature: e.feature, story: e.story, img: e.img || f.img, color: f.color, station: e.station || f.station || '', index: i
  }));
});
if (STATIONS.length) {
  const order = s => { const k = STATIONS.indexOf(s); return k < 0 ? STATIONS.length : k; };
  INTRO_ITEMS.forEach((it, n) => { it.n = n; });
  INTRO_ITEMS.sort((a, b) => order(a.station) - order(b.station) || a.n - b.n);
}

function makeThumb(f, i, big) {
  const thumb = document.createElement('div');
  thumb.className = 'thumb' + (big ? ' big' : '');
  thumb.style.background = f.color;
  thumb.textContent = i + 1;
  const img = new Image();
  img.onload = () => { thumb.textContent = ''; thumb.style.background = 'none'; thumb.appendChild(img); };
  img.src = f.img;
  return thumb;
}

let detailIndex = 0;
let detailTab = 'feature';

function renderDetailText() {
  const f = INTRO_ITEMS[detailIndex];
  $('detailText').textContent = detailTab === 'feature' ? (f.feature || '') : (f.story || '');
  $('tabFeature').classList.toggle('active', detailTab === 'feature');
  $('tabStory').classList.toggle('active', detailTab === 'story');
}

function showDetail(i) {
  detailIndex = i;
  detailTab = 'feature';
  const f = INTRO_ITEMS[i];
  $('detailName').textContent = f.name;
  $('detailStation').textContent = f.station ? f.station : '';
  const head = $('detailThumb');
  head.innerHTML = '';
  head.appendChild(makeThumb(f, f.index, true));
  renderDetailText();
  showView('detail');
}

$('tabFeature').addEventListener('click', () => { detailTab = 'feature'; renderDetailText(); });
$('tabStory').addEventListener('click', () => { detailTab = 'story'; renderDetailText(); });

(function buildIntro() {
  const list = $('introList');
  let lastStation = null;
  INTRO_ITEMS.forEach((f, i) => {
    if (STATIONS.length && f.station !== lastStation) {
      lastStation = f.station;
      const h = document.createElement('div');
      h.className = 'group-title';
      h.textContent = f.station || '其他';
      list.appendChild(h);
    }
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.appendChild(makeThumb(f, f.index, false));
    if (!STATIONS.length && f.station) {
      const st = document.createElement('span'); st.className = 'st'; st.textContent = f.station;
      tile.appendChild(st);
    }
    const label = document.createElement('span');
    label.textContent = f.name;
    tile.appendChild(label);
    tile.addEventListener('click', () => showDetail(i));
    list.appendChild(tile);
  });
})();

// ===== 操作：滑鼠 / 手指移動，放開（或點一下）投放 =====
function setPointer(e) {
  const rect = canvas.getBoundingClientRect();
  pointerX = (e.clientX - rect.left) * W / rect.width;
}
canvas.addEventListener('pointermove', setPointer);
canvas.addEventListener('pointerdown', setPointer);
canvas.addEventListener('pointerup', e => {
  setPointer(e);
  if (gameOver || paused || !canDrop) return;
  const f = FRUITS[currentLevel];
  makeFruit(currentLevel, clampX(f, pointerX), dropY(f), false);
  currentLevel = nextLevel;
  nextLevel = randLevel();
  canDrop = false;
  setTimeout(() => { canDrop = true; }, DROP_COOLDOWN);
});

function restart() {
  engine.world.bodies.filter(b => !b.isStatic).forEach(b => World.remove(engine.world, b));
  score = 0;
  $('score').textContent = 0;
  gameOver = false;
  won = false;
  overSince = null;
  fx = [];
  ghosts = [];
  mergePairs = [];
  lastRec = null;
  runId = Date.now();
  currentLevel = randLevel();
  nextLevel = randLevel();
}

function checkGameOver() {
  const now = performance.now();
  const over = engine.world.bodies.some(b =>
    !b.isStatic && b.level !== undefined && now - b.bornAt > 1000 && b.bounds.min.y < DEADLINE_Y);
  if (over) {
    if (overSince === null) overSince = now;
    if (now - overSince > OVER_DELAY) {
      gameOver = true;
      showEnd('over');
    }
  } else {
    overSince = null;
  }
}

// ===== 繪圖 =====
function drawFruit(level, x, y, angle, alpha, target, scale) {
  const ctx = target || mainCtx;
  const f = FRUITS[level];
  ctx.save();
  ctx.globalAlpha = alpha || 1;
  ctx.translate(x, y);
  ctx.rotate(angle || 0);
  if (scale && scale !== 1) ctx.scale(scale, scale);
  if (f.loaded) {
    ctx.drawImage(f.image, -f.cx - f.dw / 2, -f.cy - f.dh / 2, f.dw, f.dh);
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, f.r, 0, Math.PI * 2);
    ctx.fillStyle = f.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(f.r * 0.45, 0, f.r * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.font = 'bold ' + Math.max(12, f.r * 0.6) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(level + 1, 0, 0);
  }
  ctx.restore();
}

function popScale(b, now) {
  if (!b.popAt) return 1;
  const t = (now - b.popAt) / POP_MS;
  if (t >= 1) return 1;
  const c1 = 1.70158, c3 = c1 + 1;
  const e = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  return 0.6 + 0.4 * e;
}

function drawGhosts(now) {
  ghosts = ghosts.filter(g => now - g.start < GHOST_MS);
  ghosts.forEach(g => {
    const t = (now - g.start) / GHOST_MS;
    const x = g.x0 + (g.x1 - g.x0) * t;
    const y = g.y0 + (g.y1 - g.y0) * t;
    drawFruit(g.level, x, y, g.angle, 1 - t, null, 1 - 0.25 * t);
  });
}

function drawEffects(now) {
  fx = fx.filter(e => now - e.start < e.dur);
  fx.forEach(e => {
    const t = (now - e.start) / e.dur;
    const sec = (now - e.start) / 1000;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t);
    if (e.type === 'ring') {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * (0.9 + 0.8 * t), 0, Math.PI * 2);
      ctx.lineWidth = 1 + 5 * (1 - t);
      ctx.strokeStyle = e.color;
      ctx.stroke();
    } else if (e.type === 'dot') {
      ctx.beginPath();
      ctx.arc(e.x + e.vx * sec, e.y + e.vy * sec + 120 * sec * sec, e.size * (1 - 0.5 * t), 0, Math.PI * 2);
      ctx.fillStyle = e.color;
      ctx.fill();
    } else if (e.type === 'text') {
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeText(e.text, e.x, e.y - 34 * t);
      ctx.fillStyle = FX_TEXT_COLOR;
      ctx.fillText(e.text, e.x, e.y - 34 * t);
    }
    ctx.restore();
  });
}

function draw() {
  const now = performance.now();
  ctx.clearRect(0, 0, W, H);
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);

  // 紅線
  ctx.strokeStyle = DEADLINE_COLOR;
  ctx.lineWidth = 1;
  ctx.setLineDash([8, 6]);
  ctx.beginPath(); ctx.moveTo(0, DEADLINE_Y); ctx.lineTo(W, DEADLINE_Y); ctx.stroke();
  ctx.setLineDash([]);

  drawGhosts(now);

  engine.world.bodies.forEach(b => {
    if (b.isStatic || b.level === undefined) return;
    drawFruit(b.level, b.position.x, b.position.y, b.angle, 1, null, popScale(b, now));
    if (DEBUG) {   // 除錯：畫出真正的碰撞形狀
      ctx.save();
      ctx.beginPath();
      b.vertices.forEach((v, i) => i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y));
      ctx.closePath();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(255,0,0,0.9)';
      ctx.stroke();
      ctx.restore();
    }
  });

  drawEffects(now);

  // 準備投放的元素與導引線
  if (!gameOver && started) {
    const f = FRUITS[currentLevel];
    const x = clampX(f, pointerX);
    ctx.strokeStyle = GUIDE_COLOR;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, dropY(f)); ctx.lineTo(x, H); ctx.stroke();
    if (canDrop) drawFruit(currentLevel, x, dropY(f), 0, 0.9);
  }
}

// 右上角的「下一個」預覽
function drawNext() {
  nctx.clearRect(0, 0, 80, 80);
  if (!started) return;
  const f = FRUITS[nextLevel];
  const ext = Math.max(f.maxX - f.minX, f.maxY - f.minY) / 2;
  const s = Math.min(1, 34 / ext);
  nctx.save();
  nctx.scale(s, s);
  drawFruit(nextLevel, 40 / s - (f.minX + f.maxX) / 2, 40 / s - (f.minY + f.maxY) / 2, 0, 1, nctx);
  nctx.restore();
}

// 依照目前的螢幕大小，自動縮放遊戲框（電腦、手機都適用，長寬比不變）
function fitToScreen() {
  const hud = $('hud');
  const availH = window.innerHeight - hud.offsetHeight - 30;
  const availW = window.innerWidth * 0.96 - 6;
  const w = Math.max(120, Math.min(availW, availH * BOX_W / BOX_H));
  canvas.style.width = w + 'px';
  hud.style.width = (w + 6) + 'px';
}
window.addEventListener('resize', fitToScreen);
window.addEventListener('load', fitToScreen);
fitToScreen();

// ===== 主迴圈：用固定的時間步長更新物理，不論螢幕是 60Hz 還是 144Hz，遊戲速度都一樣 =====
const STEP = 1000 / 120;
let lastTime = performance.now();
let acc = 0;

function loop(now) {
  now = now || performance.now();
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  if (!gameOver && !paused) {
    acc += dt;
    while (acc >= STEP) {
      Engine.update(engine, STEP);
      acc -= STEP;
    }
    tryMerge();
    checkGameOver();
  } else {
    acc = 0;
  }
  draw();
  drawNext();
  requestAnimationFrame(loop);
}

// ===== 啟動：先把圖片全部載好，再開放「開始遊戲」=====
let ready = false;
async function boot() {
  const jobs = FRUITS.map(async f => {
    const img = await loadImage(f.img);
    if (img && img.naturalWidth > 0) { f.image = img; f.loaded = true; }
  });
  jobs.push((async () => {
    if (BOX_BG_IMAGE) {
      const img = await loadImage(BOX_BG_IMAGE);
      if (img) { bgCanvas = buildImageBg(img); return; }
    }
    bgCanvas = buildInterior();
  })());
  await Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 8000))]);
  FRUITS.forEach(prepareFruit);
  ready = true;
  $('btnStart').disabled = false;
  $('btnStart').textContent = TEXT.startBtn;
}
showView('start');
loop();
boot();
</script>
